    const amt = C.parseNum($('#pay-amt').value), date = $('#pay-date').value, note = C.cleanName($('#pay-note').value).slice(0, 200);

  /* ---------- Ataskaitos ---------- */
  function viewReports() {
    const r = ui.rep, t = today();
    const range = C.periodRange(r.period, t, r.from, r.to);
    const rep = C.report(S, range.from, range.to, L);
    const periods = [['today', 'Šiandien'], ['week', 'Ši savaitė'], ['month', 'Šis mėnuo'], ['custom', 'Pasirinktas']];
    const qty = Object.entries(rep.qtyByUnit).filter(([, v]) => v > 0).map(([u, v]) => `${Q(v)} ${U(u)}`).join(' · ') || '0';
    const allDebt = C.debtors(S, t, L).reduce((a, d) => a + C.cents(d.balance), 0) / 100;
    const bm = rep.byMethod;
    const stat = (l, v, s, cls, wide) => `<div class="stat${wide ? ' wide' : ''}"><div class="l">${l}</div><div class="v ${cls || ''}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
    const chartFrom = r.period === 'today' ? C.addDays(t, -6) : range.from;
    return `<section class="card">
      <div class="chips">${periods.map(([k, l]) => `<button type="button" class="chip" data-a="rep-period" data-p="${k}" aria-pressed="${r.period === k}">${l}</button>`).join('')}</div>
      ${r.period === 'custom' ? `<div class="row2 mt"><div><label class="f" for="r-from">Nuo</label><input type="date" id="r-from" data-f="r-from" value="${esc(range.from)}"></div><div><label class="f" for="r-to">Iki</label><input type="date" id="r-to" data-f="r-to" value="${esc(range.to)}"></div></div>` : ''}
      <p class="range">${range.from === range.to ? range.from + ', ' + C.WEEKDAYS[C.weekday(range.from)] : range.from + ' – ' + range.to}</p>
      <div class="stats">
        ${stat('Apyvarta', M(rep.revenue), rep.discount > 0 ? 'iš jos nuolaidų ' + M(rep.discount) : '')}
        ${stat('Pelnas', M(rep.profit), rep.revenue > 0 ? 'marža ' + C.fmtPct(rep.profit / rep.revenue * 100) : '', rep.profit < 0 ? 'red' : 'ok')}
        ${stat('Savikaina', M(rep.cost))}
        ${stat('Pardavimų', String(rep.count))}
        ${stat('Parduotas kiekis', qty, '', '', true)}
        ${stat('Gauta pinigų', M(rep.received), `grynais ${M(bm.grynais)} · kortele ${M(bm.kortele)} · pavedimu ${M(bm.pavedimu)}${rep.repaid > 0 ? `<br>iš jų skolų grąžinimai ${M(rep.repaid)}` : ''}`, 'ok', true)}
        ${stat('Liko skolose', M(rep.leftInDebt), `neapmokėta šio laikotarpio pardavimų dalis<br>visos skolos dabar: ${M(allDebt)}`, rep.leftInDebt > 0 ? 'red' : '', true)}
      </div>
    </section>
    <section class="card"><h2>Pardavimai pagal dienas${r.period === 'today' ? ' (paskutinės 7 d.)' : ''}</h2>${chartHtml(chartFrom, range.to)}</section>
    <section class="card"><h2>Populiariausios prekės</h2>${topHtml(rep)}</section>`;
  }
  function chartHtml(from, to) {
    const ser = C.salesSeries(S, from, to), pts = ser.points, n = pts.length, t = today();
    const max = Math.max(0, ...pts.map(p => p.value));
    if (max <= 0) return '<p class="muted">Šiuo laikotarpiu pardavimų nėra.</p>';
    const step = n <= 14 ? 1 : n <= 31 ? 3 : ser.monthly ? 1 : 5;
    const name = p => (ser.monthly ? p.label + ' ' + p.sub : p.key);
    const cols = pts.map(p => {
      const h = Math.round(p.value / max * 1000) / 10;
      const tip = `${name(p)}: ${M(p.value)} · ${p.count} pard.`;
      return `<button type="button" class="col${p.key === t ? ' now' : ''}" data-a="bar" data-v="${esc(tip)}" title="${esc(tip)}" aria-label="${esc(tip)}" style="--h:${h}%">${n <= 7 && p.value > 0 ? `<span class="bv">${A2(p.value)}</span>` : ''}<i></i></button>`;
    }).join('');
    const xl = pts.map((p, i) => `<span class="${p.key === t ? 'now' : ''}">${i % step === 0 || p.key === t ? (ser.monthly ? p.label : p.label + (n <= 14 ? '<br>' + p.sub : '')) : ''}</span>`).join('');
    const rows = pts.filter(p => p.value > 0).map(p => `<tr><td>${name(p)}</td><td>${p.count}</td><td>${M(p.value)}</td></tr>`).join('');
    return `<div style="--minw:${n > 31 ? '16px' : '0px'}"><div class="cscroll"><div class="bars">${cols}</div><div class="xl" aria-hidden="true">${xl}</div></div></div>
      <p class="cap muted" id="chart-cap">Daugiausia per ${ser.monthly ? 'mėnesį' : 'dieną'}: ${M(max)}. Paspauskite stulpelį — pamatysite sumą.</p>
      <details class="more"><summary>Rodyti lentelę</summary><table class="tbl"><thead><tr><th>${ser.monthly ? 'Mėnuo' : 'Diena'}</th><th>Pard.</th><th>Suma</th></tr></thead><tbody>${rows}</tbody></table></details>`;
  }
  function topHtml(rep) {
    if (!rep.topByQty.length) return '<p class="muted">Šiuo laikotarpiu pardavimų nėra.</p>';
    const nameOf = p => { const cur = p.productId && S.products.find(x => x.id === p.productId); return esc(cur ? cur.name : p.name); };
    const block = (title, list, val, fmt) => {
      const top = list.slice(0, 5), max = Math.max(0, ...top.map(val));
      return `<h3>${title}</h3><div class="top">${top.map((p, i) => `<div class="top-r"><span class="n">${i + 1}.</span><span>${nameOf(p)}</span><b>${fmt(p)}</b><span class="tb"><i style="width:${max > 0 ? Math.max(0, val(p)) / max * 100 : 0}%"></i></span></div>`).join('')}</div>`;
    };
    return block('Pagal kiekį', rep.topByQty, p => p.qty, p => `${Q(p.qty)} ${U(p.unit)}`)
      + block('Pagal pelną', rep.topByProfit, p => p.profit, p => M(p.profit));
  }

  function saveProduct() {
    const d = ui.prodDraft, name = C.cleanName($('#pf-name').value);
    const cost = C.parseNum($('#pf-cost').value.trim() || '0'), price = C.parseNum($('#pf-price').value);
    if (!name) return fieldErr('#pf-name', 'Įveskite pavadinimą.');
    if (S.products.some(p => p.id !== d.id && C.custKey(p.name) === C.custKey(name))) return fieldErr('#pf-name', 'Prekė tokiu pavadinimu jau yra.');
    if (cost == null || cost < 0) return fieldErr('#pf-cost', 'Patikrinkite savikainą.');
    if (price == null || price < 0) return fieldErr('#pf-price', 'Įveskite pardavimo kainą.');
    const fields = { name, unit: d.unit, cost: C.round2(cost), price: C.round2(price) };
    if (d.id) {
      const p = S.products.find(x => x.id === d.id);
      if (!p) return;
      Object.assign(p, fields);
      delete p.sample; // pataisyta pavyzdinė prekė tampa jūsų
    } else {
      S.products.push(Object.assign({ id: C.uid() }, fields, { createdAt: Date.now() }));
    }
    if (!save()) return;
    closeModal(); render(); toast(d.id ? 'Prekė pataisyta' : 'Prekė pridėta');
  }

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  async function download(name, text, type) {
    // iPhone programėlėje paprastas atsisiuntimas nepatikimas — atidarome bendrinimo langą („Įrašyti į Failus“, el. paštas…)
    if (isIOS && navigator.canShare) {
      const file = new File([text], name, { type });
      if (navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: name }); return true; }
        catch (e) { if (e.name === 'AbortError') return false; }
      }
    }
    const url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  }
  async function exportJson() {
    const ok = await download(`atsargine-kopija-${today()}.json`, JSON.stringify(Object.assign({ exportedAt: new Date().toISOString() }, S)), 'application/json');
    if (!ok) return;
    S.meta.lastBackup = today();
    save();
    render();
    toast(isIOS ? 'Kopija paruošta' : 'Kopija atsisiųsta');
  }
  async function importFile(file) {
    let data;
    try { data = C.normalize(JSON.parse(await file.text())); }
    catch (e) { return toast('Nepavyko nuskaityti: ' + (e instanceof SyntaxError ? 'failas sugadintas arba ne JSON' : e.message), true); }
    const ok = await ask(`Atkurti duomenis iš „${esc(file.name)}“?\nFaile: ${data.products.length} prek., ${data.sales.length} pard., ${data.payments.length} apmok.\n\nDabartiniai duomenys (${S.sales.length} pard.) bus <b>pakeisti</b> failo duomenimis. Jei abejojate — pirmiau atsisiųskite dabartinių duomenų kopiją.`, { yes: 'Atkurti', danger: true });
    if (!ok) return;
    S = data;
    if (!save()) return;
    ui.cust = null;
    render();
    toast('Duomenys atkurti');
  }
  async function clearSamples() {
    const n = countSample();
    if (!n) return;

  /* ---------- Langai, pranešimai ---------- */
  const modals = [];
  function openModal(html, focusSel) {
    const back = document.createElement('div');
    back.className = 'mback';
    back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    back.addEventListener('click', e => { if (e.target === back) closeModal(); });
    document.body.appendChild(back);
    modals.push(back);
    document.body.classList.add('noscroll');
    const f = focusSel && back.querySelector(focusSel);
    if (f) { f.focus(); if (f.select) f.select(); }
    return back;
  }
  function closeModal() {
    const m = modals.pop();
    if (m) { if (m.onClose) m.onClose(); m.remove(); }
    if (!modals.length) document.body.classList.remove('noscroll');
  }
  function ask(msg, opts) {
    opts = opts || {};
    return new Promise(resolve => {
      const m = openModal(`<p class="ask">${msg}</p><div class="m-actions"><button type="button" class="btn" data-r="0">${opts.no || 'Atšaukti'}</button><button type="button" class="btn ${opts.danger ? 'dangerfill' : 'pri'}" data-r="1">${opts.yes || 'Taip'}</button></div>`);
      m.onClose = () => resolve(false);
      m.addEventListener('click', e => {
        const b = e.target.closest('[data-r]');
        if (!b) return;
        m.onClose = null;
        closeModal();
        resolve(b.dataset.r === '1');
      });
    });
  }
  let toastTimer;
  function toast(msg, err) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'on' + (err ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = err ? 'err' : ''; }, err ? 4500 : 2800);
  }
  function fieldErr(sel, msg) {
    const el = document.querySelector(sel);
    if (el) { el.classList.add('bad'); el.focus(); }
    toast(msg, true);
  }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* nebūtina */ } }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* bandome kitaip */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  /* ---------- Veiksmai ---------- */
  const ACT = {
    tab: el => go(el.dataset.tab),
    data: () => { ui.dataView = !ui.dataView; ui.cust = null; render(); window.scrollTo(0, 0); },
    add: el => addToCart(el.dataset.id),
    qty: el => stepQty(+el.dataset.i, +el.dataset.d),
    'line-rm': el => { ui.sale.items.splice(+el.dataset.i, 1); refreshSell(); saveDraft(); },
    'cart-clear': async () => {
      if (!(await ask('Išimti visas prekes iš krepšelio?', { yes: 'Išvalyti', danger: true }))) return;
      ui.sale.items = []; refreshSell(); saveDraft();
    },
    'disc-show': el => {
      ui.sale.items[+el.dataset.i].showDisc = true;
      $('#cart').innerHTML = cartHtml();
      const d = $('#d' + el.dataset.i);
      if (d) d.focus();
    },
    'disc-type': el => {
      const it = ui.sale.items[+el.dataset.i];
      it.discType = it.discType === 'pct' ? 'eur' : 'pct';
      if (it.discType === 'pct' && it.discValue > 100) it.discValue = 0;
      $('#cart').innerHTML = cartHtml(); updateTotals(); saveDraft();
    },
    method: el => {
      ui.sale.method = el.dataset.m;
      $('#pay-sec').innerHTML = paySecHtml(); updateTotals(); saveDraft();
      if (ui.sale.method === 'dalinis') $('#s-paid').focus();
    },
    'paid-method': el => { ui.sale.paidMethod = el.dataset.m; $('#pay-sec').innerHTML = paySecHtml(); saveDraft(); },
    'cust-pick': el => {
      const same = C.custKey(el.dataset.name) === C.custKey(ui.sale.customer);
      ui.sale.customer = same ? '' : el.dataset.name;
      $('#s-cust').value = ui.sale.customer;
      onCustomerChange();
    },
    'sale-save': saveSale,
    'edit-cancel': () => { ui.sale = ui.stash || freshSale(); ui.stash = null; saveDraft(); go('pardavimai'); },
    'sale-edit': el => editSale(el.dataset.id),
    'sale-del': el => deleteSale(el.dataset.id),
    'list-range': el => {
      ui.list.range = el.dataset.r; ui.list.limit = 50;
      if (ui.list.range === 'custom' && !ui.list.from) { ui.list.from = C.addDays(today(), -29); ui.list.to = today(); }
      render();
    },
    'list-more': () => { ui.list.limit += 100; $('#list-res').innerHTML = listResHtml(); },
    'cust-open': el => { ui.tab = 'skolos'; ui.dataView = false; ui.cust = el.dataset.key; render(); window.scrollTo(0, 0); },
    'cust-close': () => { ui.cust = null; render(); window.scrollTo(0, 0); },
    'pay-open': openPay,
    'pay-save': savePay,
    'pay-del': el => deletePay(el.dataset.id),
    'pay-full': el => { const i = $('#pay-amt'); i.value = el.dataset.v; i.classList.remove('bad'); },
    'pay-method': el => { ui.payDraft.method = el.dataset.m; $('#pay-methods').innerHTML = payChips(el.dataset.m); },
    'remind-copy': async () => {
      const ta = $('#remind');
      if (await copyText(ta.value)) toast('Priminimas nukopijuotas — įklijuokite žinutėje');
      else { ta.focus(); ta.select(); toast('Nepavyko nukopijuoti automatiškai — tekstas pažymėtas, nukopijuokite jį ranka.', true); }
    },
    'remind-share': () => { navigator.share({ text: $('#remind').value }).catch(() => {}); },
    'rep-period': el => {
      ui.rep.period = el.dataset.p;
      if (ui.rep.period === 'custom' && !ui.rep.from) { ui.rep.from = today().slice(0, 8) + '01'; ui.rep.to = today(); }
      render();
    },
    bar: el => {
      const was = el.classList.contains('sel');
      document.querySelectorAll('.col.sel').forEach(b => b.classList.remove('sel'));
      if (!was) el.classList.add('sel');
      $('#chart-cap').textContent = was ? 'Paspauskite stulpelį — pamatysite sumą.' : el.dataset.v;
    },
    'prod-new': () => openProduct(null),
    'prod-edit': el => openProduct(el.dataset.id),
    'prod-del': el => deleteProduct(el.dataset.id),
    'prod-save': saveProduct,
    'unit-pick': el => { ui.prodDraft.unit = el.dataset.u; $('#pf-units').innerHTML = unitChips(el.dataset.u); $('#pf-margin').innerHTML = marginHtml(); },
    'exp-json': exportJson,
    'imp-json': () => $('#imp-file').click(),
    'exp-sales': () => download(`pardavimai-${today()}.csv`, C.salesCsv(S), 'text/csv'),
    'exp-debts': () => download(`skolos-${today()}.csv`, C.debtsCsv(S, today()), 'text/csv'),
    'exp-pays': () => download(`apmokejimai-${today()}.csv`, C.paymentsCsv(S), 'text/csv'),
    'sample-clear': clearSamples,
    'sample-load': loadSamples,
    'run-tests': showTests,
    wipe: wipeAll,
    'modal-close': closeModal,
  };
  function onCustomerChange() {
    $('#cust-hint').innerHTML = custHintHtml();
    $('#pay-sec').innerHTML = paySecHtml();
    document.querySelectorAll('#cust-chips .chip').forEach(b => b.setAttribute('aria-pressed', String(C.custKey(b.dataset.name) === C.custKey(ui.sale.customer))));
    saveDraft();
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.a];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', e => {
    const t = e.target, f = t.dataset.f;
    if (!f) return;
    if (f === 's-date') { ui.sale.date = t.value; ui.sale.dateAuto = t.value === today(); t.classList.remove('bad'); saveDraft(); }
    else if (f === 's-cust') { ui.sale.customer = t.value; t.classList.remove('bad'); onCustomerChange(); }
    else if (f === 'qty' || f === 'price' || f === 'disc') lineInput(t, f);
    else if (f === 'paid') { ui.sale.paid = t.value; const v = C.parseNum(t.value); t.classList.toggle('bad', t.value.trim() !== '' && !(v >= 0)); updateTotals(); saveDraft(); }
    else if (f === 'prod-filter') { ui.prodFilter = t.value; $('#tiles').innerHTML = tilesHtml(); }
    else if (f === 'l-cust') { ui.list.customer = t.value; ui.list.limit = 50; $('#list-res').innerHTML = listResHtml(); }
    else if (f === 'pf') { t.classList.remove('bad'); $('#pf-margin').innerHTML = marginHtml(); }
  });
  document.addEventListener('change', e => {
    const t = e.target, f = t.dataset.f;
    if (t.id === 'imp-file') { if (t.files && t.files[0]) importFile(t.files[0]); t.value = ''; return; }
    if (f === 'qty' || f === 'price' || f === 'disc') {
      const it = ui.sale.items[+t.dataset.i], v = C.parseNum(t.value);
      if (it && v != null && v >= 0 && !t.classList.contains('bad')) t.value = f === 'price' || (f === 'disc' && it.discType === 'eur') ? A2(v) : Q(v);
    } else if (f === 'paid') {
      const v = C.parseNum(t.value);
      if (v != null && v >= 0) t.value = ui.sale.paid = A2(v);
    } else if (f === 'l-from' || f === 'l-to') { ui.list[f === 'l-from' ? 'from' : 'to'] = t.value; $('#list-res').innerHTML = listResHtml(); }
    else if (f === 'l-method') { ui.list.method = t.value; ui.list.limit = 50; $('#list-res').innerHTML = listResHtml(); }
    else if (f === 'r-from' || f === 'r-to') { ui.rep[f === 'r-from' ? 'from' : 'to'] = t.value; render(); }
  });
  document.addEventListener('keydown', e => {
    if (!modals.length) return;
    const top = modals[modals.length - 1];
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && top.contains(e.target)) {
      const b = top.querySelector('[data-a$="-save"]');
      if (b) { e.preventDefault(); b.click(); }
    }
  });
  // Grįžus į programėlę kitą dieną — data vėl „šiandien“, skolų dienos perskaičiuojamos
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const s = ui.sale;
    if (!s.editId && s.dateAuto && s.date !== today()) s.date = today();
    const a = document.activeElement;
    if (!modals.length && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
  });
  // Atidaryta keliuose languose — imame naujausius duomenis
  window.addEventListener('storage', e => {
    if (e.key !== KEY || !e.newValue) return;
    try { S = C.normalize(JSON.parse(e.newValue)); if (!modals.length) render(); } catch (err) { /* ignoruojame */ }
  });

  render();

  // Kai programėlė atidaryta iš https adreso — įsimena save, kad veiktų ir be interneto
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
